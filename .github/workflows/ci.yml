name: BootSentry CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: |
        ruff check src/ tests/

    - name: Run unit & integration tests
      run: |
        pytest --cov=src/bootsentry --cov-report=xml --cov-report=term-missing tests/

    - name: Verify PQC ML-DSA-65 Benchmarks
      run: |
        python -m bootsentry.crypto.benchmark --iterations 2

    - name: Smoke test Rich TUI Demonstrator (Safe Replay)
      run: |
        python -m bootsentry.demo.tui --scenario clean
        python -m bootsentry.demo.tui --scenario a1_downgrade
        python -m bootsentry.demo.tui --scenario a2_toctou
        python -m bootsentry.demo.tui --scenario a5_cross_sku

