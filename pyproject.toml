[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bootsentry"
version = "1.0.0"
description = "AI-Assisted Secure Boot & Integrity Verification with Post-Quantum Cryptography"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "BootSentry Core Team" }]
license = { text = "Apache-2.0" }
dependencies = [
    "dilithium-py>=1.4.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "psutil>=5.9.0",
    "rich>=13.7.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.1",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except (no generic Exception catching)
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # do not perform function calls in argument defaults (e.g. typer/path defaults)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "BLE001", # tests can catch broad exceptions during negative testing
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["src/bootsentry"]
omit = [
    "src/bootsentry/eval/judge_check.py",
    "src/bootsentry/demo/tui.py",
    "src/bootsentry/cli.py",
]

[tool.coverage.report]
show_missing = true


