[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bootsentry"
version = "1.0.0"
description = "AI-Assisted Secure Boot & Integrity Verification with Post-Quantum Cryptography"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "BootSentry Core Team" }]
license = { text = "Apache-2.0" }
dependencies = [
    "dilithium-py>=1.4.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "psutil>=5.9.0",
    "rich>=13.7.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.1",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
